# Exported from Render on 2026-08-13T14:58:42Z
version: "1"
projects:
- name: NLL-emulator
  environments:
  - name: Production
    services:
    - type: web
      name: NLL-emulator
      runtime: node
      repo: https://github.com/Cambio-Evolution/NLL-emulator
      plan: starter
      envVars:
      - key: BASE_PATIENT_COUNT
        value: "1005"
      - key: GROWTH_START_DATE
        value: "2026-08-11"
      - key: DAILY_GROWTH
        value: "50"
      - key: SEED_ON_START
        value: "true"
      - key: MOCK_CLIENT_ID
        value: nll-mock-client
      - key: DATABASE_URL
        fromDatabase:
          name: NLL-DB-mock
          property: connectionString
      - key: MOCK_CLIENT_SECRET
        value: nll-mock-secret
      region: frankfurt
      buildCommand: npm install && npm run build
      startCommand: npm start
      autoDeployTrigger: commit
      rootDir: server
    - type: web
      name: NLL-emulator-webpage
      runtime: static
      repo: https://github.com/Cambio-Evolution/NLL-emulator
      envVars:
      - key: VITE_API_BASE
        value: https://nll-emulator.onrender.com
      - key: VITE_MOCK_CLIENT_ID
        value: nll-mock-client
      - key: VITE_MOCK_CLIENT_SECRET
        value: nll-mock-secret
      buildCommand: npm run build
      staticPublishPath: dist
      autoDeployTrigger: commit
      rootDir: client
    databases:
    - name: NLL-DB-mock
      databaseName: nll_db_mock
      user: nll_db_mock_user
      plan: basic-256mb
      region: frankfurt
      ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere
      postgresMajorVersion: "18"
      diskSizeGB: 15
